[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/mcmodsgui-supervisord.pid

[program:backend]
command=node /opt/minepanel/backend/dist/main.js
directory=/opt/minepanel/backend
priority=10
stopwaitsecs=255
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=node /opt/minepanel/frontend/server.js
directory=/opt/minepanel/frontend
user=nextjs
priority=20
environment=PORT="3000",HOSTNAME="127.0.0.1"
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=caddy run --config /opt/minepanel/haos/Caddyfile --adapter caddyfile
priority=30
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
