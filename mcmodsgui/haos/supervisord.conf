[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/mcpanelhaos-supervisord.pid

[program:discopanel]
command=/opt/discopanel/discopanel -config /opt/discopanel/haos
directory=/opt/discopanel
priority=10
stopwaitsecs=145
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=caddy run --config /opt/discopanel/haos/Caddyfile --adapter caddyfile
priority=20
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
