name: "MCPanelHAOS"
description: "Verwaltet Minecraft-Java-Modserver direkt auf diesem HAOS. Docker-Zugriff nach Deaktivierung des Schutzmodus erforderlich."
version: "1.0.0"
slug: mcmodsgui
arch:
  - amd64
stage: experimental
startup: application
boot: manual
init: true
timeout: 290
docker_api: true
ingress: true
ingress_port: 8099
panel_title: MCPanelHAOS
panel_icon: mdi:minecraft
panel_admin: true
webui: "https://[HOST]:[PORT:8443]"
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: "HTTPS der Minecraft-Verwaltung"
map:
  - type: data
    path: /app
backup: cold
options:
  panel_hostname: homeassistant.local
  panel_port: 8443
schema:
  panel_hostname: str
  panel_port: "int(1,65535)"
